# Optional local containers. The supported startup on this machine is
# scripts/start_local.ps1, which uses the existing CUDA environment.
# The checkpoint and saved reports stay on the host and are mounted read-only.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "8080:80"
    depends_on:
      - api
